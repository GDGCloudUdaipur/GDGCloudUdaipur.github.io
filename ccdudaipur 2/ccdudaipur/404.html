<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost on the lake · CCD Udaipur 2026</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
    .lost { display: grid; place-content: center; text-align: center; gap: 18px; padding: 80px 20px 20px; position: relative; z-index: 1; }
    .lost h1 { font-size: clamp(90px, 20vw, 220px); letter-spacing: -0.06em; }
    .lost p { font-size: 20px; color: var(--ink-2); max-width: 520px; margin-inline: auto; }
    #scene404 { height: 40vh; }
    #scene404 svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="lost">
    <span class="eyebrow">Error 404</span>
    <h1 class="grad">404</h1>
    <p>This boat drifted past Jag Mandir and out of the map. The page you were looking for isn't here.</p>
    <div class="cta-row center"><a class="btn btn-dark" href="./">Row back to shore →</a></div>
  </div>
  <div id="scene404"></div>
  <script src="js/scene.js"></script>
  <script>UdaipurScene.build(document.getElementById("scene404"), { seed: 9 }).setHour(18);</script>
</body>
</html>
